# Host-parity diagnostics for the inferact tpu7x-8 hosts. Both steps run the
# same checks in the image from tpu-inference-ci #870, one on an inferact host
# and one on a cicd host, so a difference between them comes from the host.
# PHASES selects checks (facts, numerics, kernels); set it on the build to
# rerun one phase.
env:
  DEBUG_IMAGE: "us-central1-docker.pkg.dev/cloud-ullm-inference-ci-cd/tpu-inference-ci/vllm-tpu@sha256:416be693c6a289b957a0eee76c450c4bc932d0c4c7f970d011b70bfd4747e48a"
  PHASES: "${PHASES:-facts,numerics,kernels}"

steps:
  - label: ":mag: host parity: inferact"
    key: parity-inferact
    agents:
      queue: tpu_v7x_8_queue
      hostname: "tpu7x-8-ci-*-inferact-us-central1-c"
    priority: 10
    timeout_in_minutes: 90
    command: bash .buildkite/scripts/inferact_debug/run.sh
    artifact_paths: "inferact_debug_out/**/*"

  - label: ":mag: host parity: cicd"
    key: parity-cicd
    agents:
      queue: tpu_v7x_8_queue
      hostname: "tpu7x-8-ci-*-cicd-us-central1-c"
    priority: 10
    timeout_in_minutes: 90
    command: bash .buildkite/scripts/inferact_debug/run.sh
    artifact_paths: "inferact_debug_out/**/*"
